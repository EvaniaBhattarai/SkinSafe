<!DOCTYPE html>
<html>

<head>
    <title>SkinSafe</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/x-icon" href="icons/more_icons/music_notes.png">

    <link href="style/main.css" rel="stylesheet" type="text/css" />
    <link href="style/dropDown.css" rel="stylesheet" type="text/css" />
    <link href="style/myDropDown.css" rel="stylesheet" type="text/css" />
    <link href="style/home.css" rel="stylesheet" type="text/css" />
    <link href="style/blog.css" rel="stylesheet" type="text/css" />
    <link href="style/product.css" rel="stylesheet" type="text/css" />
    <link href="style/site.css" rel="stylesheet" type="text/css" />
    <link href="style/commonStyle.css" rel="stylesheet" type="text/css" />
    <link href="style/clickSort.css" rel="stylesheet" type="text/css" />
    <link href="style/modalStyle.css" rel="stylesheet" type="text/css" />

    <script src='https://unpkg.com/react@18/umd/react.production.min.js'></script>
    <script src='https://unpkg.com/react-dom@18/umd/react-dom.production.min.js'></script>
    <script src='https://unpkg.com/babel-standalone@6.26.0/babel.js'></script>
    <script src='https://unpkg.com/react-router-dom@5.0.0/umd/react-router-dom.min.js'></script>
</head>

<body>
    <div id="root"></div>

    <!-- JS reusable -->
    <script src="_JS_reusable/ajax_alt.js"></script>
    <script src="_JS_reusable/dropDownFW.js"></script>
    <script src="_JS_reusable/MakeProduct.js"></script>
    <script src="_JS_reusable/jsSort.js"></script>
    <script src="_JS_reusable/sortOrder.js"></script>
    <script src="_JS_reusable/filterObjList.js"></script>

    <!-- Modal framework -->
    <script src="_JS_reusable/modalFw.js"></script>

    <!-- JS Content Generating functions -->
    <script src="_JS_CGF/MakeProduct_CGF.js"></script>

    <!-- React reusable -->
    <script type="text/babel" src="_React_reusable/ConvertEle.js"></script>
    <script type="text/babel" src="_React_reusable/AjaxUsers.js"></script>
    <script type="text/babel" src="_React_reusable/AjaxProduct.js"></script>

    <!-- React Content Generating functions -->
    <script type="text/babel" src="_React_CGF/HomeR.js"></script>
    <script type="text/babel" src="_React_CGF/BlogR.js"></script>
    <script type="text/babel" src="_React_CGF/UserFilterTable.js"></script>
    <script type="text/babel" src="_React_CGF/UserSortTable.js"></script>
    <script type="text/babel" src="_React_CGF/UserTable.js"></script>
    <script type="text/babel" src="_React_CGF/Logon.js"></script>
    <script type="text/babel" src="_React_CGF/GetProfile.js"></script>
    <script type="text/babel" src="_React_CGF/LogOff.js"></script>

    <!-- Insert/Update form components -->
    <script type="text/babel" src="_React_CGF/UserInsertOrUpdate.js"></script>
    <script type="text/babel" src="_React_CGF/ProductInsertOrUpdate.js"></script>

    <script type="text/babel">

        "use strict";

        dropDownFW({
            dropHeaderStyle: "dropHeader",
            dropContentStyle: "dropContent",
            showStyle: "show",
            hideStyle: "hide"
        });

        const Link = ReactRouterDOM.Link;
        const Route = ReactRouterDOM.Route;

        const App = () => (
            <ReactRouterDOM.HashRouter>

                <div id="titleNav">
                    <div id="title">
                        Product Checker
                    </div>
                    <div id="nav">
                        <div class="dropDown">
                            <Link to="/home">Home</Link>
                        </div>
                        <div class="dropDown">
                            <div class="dropHeader">Account</div>
                            <div class="dropContent">
                                <Link to="/userInsert">Register</Link> <br />
                                <Link to="/logon">Log In</Link> <br />
                                <Link to="/logoff">Log Out</Link> <br />
                                <Link to="/profile">Get Profile</Link> <br />
                            </div>
                        </div>

                        <div class="dropDown">
                            <div class="dropHeader">Search</div>
                            <div class="dropContent">
                                <Link to="/usersDb">Users</Link> <br />
                                <Link to="/productDb">Products</Link><br />
                            </div>
                        </div>

                        <div class="dropDown">
                            <div class="dropHeader">Homework</div>
                            <div class="dropContent">
                                <Link to="/blog">Blog</Link> <br />
                                <a target="_blank" href="images/Bhattarai_database.pdf">My DB PDF</a> <br />
                                <Link to="/myProducts">JS Product Objects</Link> <br />
                                <a target="_blank" href="webUser/getAll">Users Web API</a> <br />
                                <a target="_blank" href="product/getAll">Product Web API</a> <br />
                            </div>
                        </div>
                    </div>
                </div>

                <div id="content">
                    <Route path="/" exact component={HomeR} />
                    <Route path="/home" component={HomeR} />
                    <Route path="/myProducts" component={() => <ConvertEle ele={MakeProduct_CGF()} />} />
                    <Route path="/usersDb" component={() => AjaxUsers("webUser/getAll")} />
                    <Route path="/productDb" component={() => AjaxProduct("product/getAll")} />
                    <Route path="/userInsert" component={UserInsertOrUpdate} />
                    <Route path="/userUpdate/:id" component={UserInsertOrUpdate} />
                    <Route path="/productInsert" component={ProductInsertOrUpdate} />
                    <Route path="/productUpdate/:id" component={ProductInsertOrUpdate} />
                    <Route path="/blog" component={BlogR} />
                    <Route path="/logon" component={Logon} />
                    <Route path="/profile" component={GetProfile} />
                    <Route path="/logoff" component={LogOff} />
                </div>

                <div id="footer">
                    [Evania Bhattarai]
                </div>

            </ReactRouterDOM.HashRouter>
        );

        ReactDOM.render(<App />, document.getElementById('root'));

    </script>

</body>

</html>
